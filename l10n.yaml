# Configurazione della generazione delle traduzioni.
# I file ARB sorgente e il codice generato stanno entrambi sotto lib/l10n.

arb-dir: lib/l10n
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# app_en.arb e il template: ogni chiave nasce qui e genera un getter tipizzato.
template-arb-file: app_en.arb

# In Flutter 3.41 il codice viene scritto direttamente nel progetto (output-dir),
# quindi restiamo dentro lib/l10n senza package sintetico.

# Le chiavi devono essere nomi di metodo Dart validi: camelCase, in inglese,
# prefissate dal modulo di appartenenza (cassaTotal, productsAdd, settingsLanguage).
# gen_l10n non accetta chiavi annidate ne punti.

# Lingue supportate. Per aggiungerne una basta creare il file ARB corrispondente.
preferred-supported-locales:
  - en
  - it

# Le chiavi non tradotte nelle altre lingue finiscono qui, utili in CI.
untranslated-messages-file: lib/l10n/untranslated.json

# AppLocalizations.of(context) restituisce il valore diretto, senza nullable.
nullable-getter: false
