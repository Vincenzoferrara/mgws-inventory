# Localization generation configuration.
# ARB source files and generated code are both stored under lib/l10n.

arb-dir: lib/l10n
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# gen-l10n still emits the legacy flutter_localizations delegates in the
# generated file. The app uses GlobalMaterialLocalizations.delegates from
# material_ui instead, so the unused generated list is exempted here.
header: "// ignore_for_file: deprecated_member_use"

# `app_en.arb` is the template: every key is defined here and generates a typed getter.
template-arb-file: app_en.arb

# Flutter 3.41 writes generated code directly into the project (output-dir),
# so we stay inside lib/l10n without a synthetic package.

# Keys must be valid Dart method names: camelCase, in English, and prefixed
# with the owning module (for example checkoutTotal, productsAdd, settingsLanguage).
# gen_l10n does not accept nested keys or dots.

# Supported languages. To add one, create the corresponding ARB file.
preferred-supported-locales:
  - en
  - it

# Strings missing in other languages are listed here and used in CI.
untranslated-messages-file: lib/l10n/untranslated.json

# AppLocalizations.of(context) returns a direct value, without nullability.
nullable-getter: false
