name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation in the shop, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cashier
        - Products
        - Inventory
        - Templates and print
        - Orders, customers, coupons
        - Loyalty cards
        - Employees and suppliers
        - Dashboard and reports
        - Settings
        - Other platform (e.g. Shopify)
        - Other
  - type: dropdown
    id: needs-plugin
    attributes:
      label: Does it need the MGWS plugin?
      options:
        - I don't know
        - "No, the app alone"
        - "Yes, with the MGWS plugin"
