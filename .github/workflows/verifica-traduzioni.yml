name: verifica traduzioni

# La CI blocca la pull request se le traduzioni non sono complete.
# Chi aggiunge una stringa in app_en.arb e si dimentica di tradurla in
# app_it.arb vede subito l'errore, senza doverlo scoprire in fase di test.
on:
  push:
    branches: [master]
  pull_request:

env:
  FLUTTER_VERSION: '3.47.5'
  PROJECT_PATH: src/mgws_inventory
  REPORT_REPO: ${{ vars.REPORT_REPO || 'Vincenzoferrara/report_flutter' }}
  REPORT_REF: ${{ vars.REPORT_REF || 'main' }}
  ADS_CONNECTOR_REPO: ${{ vars.ADS_CONNECTOR_REPO || 'Vincenzoferrara/ads_connector_flutter' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJECT_PATH }}
          sparse-checkout: |
            /*
            !/docker/
          sparse-checkout-cone-mode: false

      - name: Checkout local package report
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPORT_REPO }}
          ref: ${{ env.REPORT_REF }}
          path: report

      - name: Checkout local package ads_connector_flutter
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ADS_CONNECTOR_REPO }}
          path: ads_connector_flutter

      - name: Verify external local packages
        run: |
          missing=0
          for dir in report ads_connector_flutter; do
            if [ ! -d "$GITHUB_WORKSPACE/$dir" ]; then
              echo "::error::Missing local package '$dir'. Set repository variable '$([ "$dir" = report ] && printf REPORT_REPO || printf ADS_CONNECTOR_REPO)' to owner/repo or vendor the package into this repository."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Installa le dipendenze
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Genera le classi di localizzazione
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter gen-l10n

      - name: Compila senza errori
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter analyze --no-fatal-infos

      - name: Verifica che le traduzioni siano complete
        working-directory: ${{ env.PROJECT_PATH }}
        run: dart run lib/traduzioni/verifica_traduzioni.dart
